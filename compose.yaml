name: courseflow

services:
  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: courseflow_dev
      POSTGRES_PASSWORD: courseflow-local-password
      POSTGRES_USER: courseflow
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseflow -d courseflow_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - courseflow-postgres:/var/lib/postgresql/data

  object-store:
    image: localstack/localstack:4.14.0
    environment:
      DEBUG: "0"
      SERVICES: s3
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://localhost:4566/_localstack/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - courseflow-object-store:/var/lib/localstack

volumes:
  courseflow-object-store:
  courseflow-postgres:
